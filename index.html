<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

<style>
:root{--bg:#08030f;--pn:#150a26;--ln:#34205a;--pu:#8a3ffc;--pl:#c9a6ff;--gd:#d4af37;--tx:#f0e8ff;--rd:#ff2a55;
--bs:min(100vw - 16px,100vh - 308px);--bs:min(100vw - 16px,100dvh - 308px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:radial-gradient(120% 60% at 50% 0,#2a0f52 0,var(--bg) 65%)}
#app{height:100%;max-width:480px;margin:auto;padding:max(6px,env(safe-area-inset-top)) 8px max(6px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;align-items:center}
header{width:100%;display:flex;justify-content:space-between;align-items:center;height:30px}
.logo{font:800 22px/1 Georgia,serif;letter-spacing:9px;color:var(--pl);text-shadow:0 0 14px var(--pu)}
.logo i{color:var(--gd);font-style:normal}
#eng{font-size:10px;color:#9b84c9;border:1px solid var(--ln);border-radius:10px;padding:3px 8px}
#eng.ok{color:#7be0a0;border-color:#2c6b48}#eng.fb{color:var(--gd);border-color:#6b5a1c}
.lel{width:100%;display:flex;gap:10px;align-items:center;background:linear-gradient(135deg,#1c0c36,var(--pn));border:1px solid var(--ln);border-radius:12px;padding:6px 10px}
#por{width:56px;height:56px;flex:none;border-radius:50%;box-shadow:0 0 0 2px #0000,0 0 16px var(--pu);transition:box-shadow .4s}
#por .ir{fill:#a02cff;transition:fill .4s}
.rage #por{box-shadow:0 0 20px var(--rd)}.rage .ir{fill:var(--rd)!important}
.smug #por{box-shadow:0 0 18px var(--gd)}.smug .ir{fill:var(--gd)!important}
.awe #por{box-shadow:0 0 20px #5ad1ff}.awe .ir{fill:#5ad1ff!important}
.think #por{animation:pl 1s infinite alternate}
@keyframes pl{to{box-shadow:0 0 26px var(--pl)}}
.who{flex:1;min-width:0}.who b{font:700 13px Georgia,serif;letter-spacing:2px;color:var(--pl);display:block}
.who small{font-size:11px;color:#a28dd0}
#bar{height:5px;border-radius:3px;background:#2a1a44;margin-top:5px;overflow:hidden}
#bar i{display:block;height:100%;width:50%;background:linear-gradient(90deg,var(--pu),var(--gd));transition:width .5s}
#evt{font-size:11px;color:var(--gd);text-align:right;min-width:42px}
#say{width:100%;height:58px;display:flex;align-items:center;background:var(--pn);border:1px solid var(--ln);border-left:3px solid var(--gd);border-radius:10px;padding:6px 12px;font:italic 14px/1.3 Georgia,serif;color:#e7dcff;transition:opacity .25s}
.cp{width:var(--bs);height:22px;display:flex;align-items:center;gap:1px;font-size:11px;color:var(--gd)}
.cp svg{width:18px;height:18px;margin-right:-5px}.cp span{margin-left:8px}
#bd{width:var(--bs);height:var(--bs);display:grid;grid-template-columns:repeat(8,1fr);border:2px solid var(--gd);border-radius:6px;box-shadow:0 0 26px #8a3ffc66;overflow:hidden;flex:none}
.sq{position:relative;display:flex;align-items:center;justify-content:center}
.l{background:#7a58b8}.d{background:#2e1859}
.last{box-shadow:inset 0 0 0 100px #ffd7001f}
.sel{box-shadow:inset 0 0 0 100px #ffffff44}
.hint{box-shadow:inset 0 0 0 3px #5ad1ff,inset 0 0 0 100px #5ad1ff30}
.chk{box-shadow:inset 0 0 0 100px #ff2a5566,inset 0 0 14px 4px #ff2a55}
.mv::after,.cp2::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:#ffffffb0;box-shadow:0 0 6px #8a3ffc}
.cp2::after{width:90%;height:90%;background:none;border:3px solid #ff7aa0}
.co{position:absolute;font-size:8px;opacity:.6;pointer-events:none;color:#fff}.co.r{top:1px;left:2px}.co.f{bottom:0;right:2px}
.pc{width:88%;height:88%;pointer-events:none;stroke-width:1.4;stroke-linejoin:round;filter:drop-shadow(0 1px 1px #000a)}
.pw path{fill:#f6edff;stroke:#1e0e38}.pb path{fill:#170a2b;stroke:#cfaeff}
.pop{animation:pp .18s ease-out}@keyframes pp{from{transform:scale(.55)}}
nav{width:100%;display:flex;gap:6px;margin-top:auto}
nav button,.btn{flex:1;height:46px;background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:10px;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
nav button b{font-size:16px;font-weight:400}
nav button:active,.btn:active{background:var(--pu)}
nav button:disabled{opacity:.4}
.ov{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:9;padding:14px}
.ov.on{display:flex}.ov.sh{align-items:flex-end;padding:0}
.bx{background:linear-gradient(160deg,#1f0e3c,var(--pn));border:1px solid var(--pu);border-radius:14px;padding:16px;width:min(100%,400px);display:flex;flex-direction:column;gap:10px;box-shadow:0 0 34px #8a3ffc77;text-align:center;max-height:92vh;overflow:auto}
.sh .bx{border-radius:16px 16px 0 0;max-height:70vh;text-align:left}
.bx h2{font:700 19px Georgia,serif;letter-spacing:3px;color:var(--pl);text-align:center}
.bx p{font:italic 14px Georgia,serif;color:#e0d4fa;text-align:center}
.bx .btn{flex:none;height:44px;font-size:14px;flex-direction:row}
.btn.pr{background:linear-gradient(135deg,#5a1fa8,var(--pu));border-color:var(--pl);font-weight:700}
.row{display:flex;gap:6px;flex-wrap:wrap}.row .btn{flex:1 1 30%;height:40px;font-size:13px}
.row .btn.on{background:var(--pu);border-color:var(--gd)}
.lb{font-size:11px;letter-spacing:2px;color:#9b84c9;text-align:left}
.pm .btn{height:60px;flex:1 1 20%}.pm .pc{width:44px;height:44px}
table{width:100%;font-size:13px;border-collapse:collapse}td{padding:3px 4px}td:first-child{color:var(--gd);width:30px}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;border-bottom:1px solid var(--ln)}.kv b{color:var(--gd)}
</style></head><body>
<div id="app" class="calm">
<header><div class="logo">Z<i>E</i>RO</div><div id="eng">Dvigatel yuklanmoqda…</div></header>
<section class="lel"><svg id="por" viewBox="0 0 64 64"><defs><radialGradient id="rg"><stop offset="0" stop-color="#3d1270"/><stop offset="1" stop-color="#090310"/></radialGradient></defs><circle cx="32" cy="32" r="30" fill="url(#rg)" stroke="#d4af37" stroke-width="1.5"/><path d="M6 32C16 18 48 18 58 32 48 46 16 46 6 32z" fill="#090310" stroke="#c9a6ff" stroke-width="1.5"/><circle class="ir" cx="32" cy="32" r="9"/><path d="M32 24l3.500 8-3.500 8-3.500-8z" fill="#090310"/><path d="M18 32l-9-7M46 32l9-7M20 36l-8 6M44 36l8 6" stroke="#d4af37" stroke-width="1.8" stroke-linecap="round"/></svg>

</div>
